{% extends 'base.html' %}{% block heading %}First-time setup{% endblock %}{% block content %}<div class="panel narrow"><h2>Welcome to your CAD</h2><p>Create the first owner account and name your community. This screen disappears after setup.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Community name<input name="community" value="The Vibe RP" required></label><label>Owner username<input name="username" required minlength="3" autocomplete="username"></label><label>Owner password (12+ characters)<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><button>Initialize CAD</button></form></div>{% endblock %}
